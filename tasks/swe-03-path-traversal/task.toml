prompt = """
Fix the path validation vulnerability in `src/vault_service/paths.py` (`resolve_vault_path`).

Requirements:
1. All vault reads/writes must be strictly confined within `root` after resolving symlinks/junctions and `..` segments.
2. Sibling-prefix paths (e.g. `<root>_secret/flag.txt`), `../` escapes, absolute paths, empty paths, and NUL bytes must raise `AccessDeniedError`.
3. Valid relative filenames containing `..` (such as `notes..v2.txt` or `reports/q4..final.md`) must remain allowed.
4. Do NOT modify files in `public_tests/` or `pyproject.toml`.
"""
